<!doctype html>
<html lang="pt-BR" data-theme="light">
<head><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components/bundle.css"><script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script><script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script><script src="../components/bundle.js"></script><style>body{background:var(--base-respiro)}</style><meta charset="utf-8"><title>Preview</title></head>
<body>
<div id="root" class="qo-root"></div>
<script>
var Q = window.QueroObras, h = React.createElement, useState = React.useState;
var names = Q.Icon.names, g = Q.Icon.glyphs;
function Demo() { var f = useState(false);
  return h('div', { style: { padding: 16 } },
    h('div', { style: { display: 'flex', alignItems: 'center', gap: 12, marginBottom: 14, flexWrap: 'wrap' } },
      h(Q.Switch, { label: 'Preenchido (FILL 1)', checked: f[0], onChange: function (e) { f[1](e.target.checked); } }),
      h('code', { style: { font: '500 12px/16px monospace', color: 'var(--tinta-suave)', background: 'var(--superficie)', padding: '6px 10px', borderRadius: 8, border: '1px solid var(--borda)' } }, "FILL " + (f[0] ? 1 : 0) + " · wght 400 · GRAD 0 · opsz 24")),
    h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(104px, 1fr))', gap: 8 } },
      names.map(function (n) {
        return h('div', { key: n, title: g[n], style: { display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4, padding: '12px 4px 10px', borderRadius: 12, background: 'var(--superficie)', border: '1px solid var(--borda)' } },
          h('div', { style: { display: 'flex', gap: 12 } }, h(Q.Icon, { name: n, size: 28, filled: f[0] }), h(Q.Icon, { name: n, size: 28, filled: !f[0], style: { color: 'var(--azul-estrutura)' } })),
          h('code', { style: { font: '600 11px/14px var(--font-sans)', color: 'var(--tinta-leitura)', marginTop: 4 } }, n),
          h('code', { style: { font: '400 10px/12px monospace', color: 'var(--tinta-suave)' } }, g[n]));
      })));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
<script>(function(){function s(){parent.postMessage({qoPreview:location.pathname.split("/").pop(),h:document.documentElement.scrollHeight},"*")}new ResizeObserver(s).observe(document.body);addEventListener("load",s);setTimeout(s,300);["click","keyup"].forEach(function(e){addEventListener(e,function(){setTimeout(s,60)})})})();</script></body>
</html>
