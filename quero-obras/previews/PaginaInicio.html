<!doctype html>
<html lang="pt-BR" data-theme="light">
<head><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components/bundle.css"><script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script><script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script><script src="../components/bundle.js"></script><style>body{background:var(--base-respiro)}</style><meta charset="utf-8"><title>Preview</title></head>
<body>
<div id="root" class="qo-root"></div>
<script>
var Q = window.QueroObras, h = React.createElement, useState = React.useState;
function Home() {
  var nav = useState(0), sel = useState(null);
  return h('div', { className: 'qo-phone' }, h(Q.AppShell, {
    appBar: h(Q.AppBar, { logo: '../assets/logo-quero-obras.png', actions: [{ icon: 'bell', label: 'Notificações', badge: 2 }] }),
    bottomNav: h(Q.BottomNav, { value: nav[0], onChange: nav[1], items: [{ icon: 'home', label: 'Início' }, { icon: 'pedidos', label: 'Pedidos' }, { icon: 'chat', label: 'Mensagens', badge: 2 }, { icon: 'user', label: 'Perfil' }] }) },
    h(Q.Stack, { gap: 5, style: { padding: '8px 16px 24px' } },
      h(Q.GreetingHeader, { title: 'Olá! Vamos transformar?', subtitle: 'Qual serviço você precisa?', badge: h(Q.Badge, { tone: 'sucesso', icon: 'check' }, 'Verificado') }),
      h(Q.SearchField, { placeholder: 'Buscar serviço' }),
      h(Q.ServiceGrid, { value: sel[0], onSelect: sel[1] }),
      h(Q.PromoCard, { image: '../assets/casa-promo.png', imageAlt: 'Fachada de casa reformada', title: 'Sua ideia começa aqui', text: 'Encontre profissionais para sua obra.', primaryLabel: 'solicitar orçamento', primaryVariant: 'secundario', secondaryLabel: 'Ver profissionais' }),
      h(Q.Card, null, h('h2', { style: { margin: '0 0 16px', font: '700 16px/22px var(--font-display)' } }, 'Seu pedido de pintura'), h(Q.Stepper, { current: 1 })))));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Home));
</script>
<script>(function(){function s(){parent.postMessage({qoPreview:location.pathname.split("/").pop(),h:document.documentElement.scrollHeight},"*")}new ResizeObserver(s).observe(document.body);addEventListener("load",s);setTimeout(s,300)})();</script></body>
</html>
