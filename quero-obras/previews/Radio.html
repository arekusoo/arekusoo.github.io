<!doctype html>
<html lang="pt-BR" data-theme="light">
<head><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components/bundle.css"><script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script><script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script><script src="../components/bundle.js"></script><style>body{background:var(--base-respiro)}</style><meta charset="utf-8"><title>Preview</title></head>
<body>
<div id="root" class="qo-root"></div>
<script>
var Q = window.QueroObras, h = React.createElement, useState = React.useState;
function Demo() {
  var s = useState('Este mês');
  return h('div', { className: 'qo-demo qo-demo--col', role: 'radiogroup' },
    ['Este mês', 'Nos próximos 3 meses', 'Só estou pesquisando'].map(function (p) {
      return h(Q.Radio, { key: p, name: 'prazo', label: p, checked: s[0] === p, onChange: function () { s[1](p); } });
    }));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
<script>(function(){function s(){parent.postMessage({qoPreview:location.pathname.split("/").pop(),h:document.documentElement.scrollHeight},"*")}new ResizeObserver(s).observe(document.body);addEventListener("load",s);setTimeout(s,300)})();</script></body>
</html>
